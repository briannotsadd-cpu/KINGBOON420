name: db-test
on:
  push:
    paths: ['supabase/**', 'docs/master/role_permissions.yaml', 'docs/master/tools/**', '.github/workflows/db-test.yml']
  pull_request:
jobs:
  db-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 16 and PyYAML
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 python3-yaml || {
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
            echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
            sudo apt-get update && sudo apt-get install -y postgresql-16 python3-yaml
          }
          sudo systemctl stop postgresql || true
      - name: Role matrix is current
        run: python3 docs/master/tools/role_matrix.py --check
      - name: DB tests (throwaway cluster)
        run: sudo env PGBIN=/usr/lib/postgresql/16/bin bash supabase/tests/run.sh
